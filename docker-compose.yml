# Green Terminal — full stack in one container (app + managed EDGE gateway).
#
# Preview after `docker compose up --build`:
#   Green Terminal UI : http://127.0.0.1:7787/
#
# The G-Flow WASM surface was retired: the EdgeDepth gateway is now a purely
# INTERNAL service (loopback inside the container, probed by
# /api/edgedepth/status). Its port is deliberately NOT published — the
# browser no longer connects to it, and the native workspace widgets stream
# depth/trades through the app's own /api/market-data/ws fabric instead.
#
# The prebuilt bin/edgedepth-gateway is linux/amd64 — platform is pinned so
# Apple Silicon / ARM hosts use emulation instead of failing exec format.

services:
  green-terminal:
    build:
      context: .
      dockerfile: Dockerfile
    image: green-terminal:local
    container_name: green-terminal
    platform: linux/amd64
    ports:
      # Green Terminal UI (chart workspace with native order-flow widgets)
      - "7787:7787"
    environment:
      # Internal service coordinates — container loopback, never published.
      EDGEDEPTH_PORT: "18791"
      EDGEDEPTH_HOST: "127.0.0.1"
      LSE_TERMINAL_CONFIG_DIR: "/tmp/lse-terminal"
      LSE_TERMINAL_REMOTE: "1"
      PYTHONUNBUFFERED: "1"
      # Code is mounted read-only (see volumes): never write .pyc into it.
      PYTHONDONTWRITEBYTECODE: "1"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7787/api/health"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    # Persist workspace/config across restarts (optional).
    volumes:
      - gt-config:/tmp/lse-terminal
      # Live code mount (data saver): the container reads the app and gateway
      # binary straight from this checkout, so `git pull` + `docker compose up`
      # picks up updates with NO rebuild and NO downloads. Rebuild (`--build`)
      # only when the Dockerfile or Python dependencies change.
      - ./:/app:ro

volumes:
  gt-config:
