<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1512"/>
      <stop offset="1" stop-color="#0a0f0d"/>
    </linearGradient>
    <style>
      .h1{fill:#e8fff4;font-size:22px;font-weight:700}
      .h2{fill:#9fead0;font-size:15px;font-weight:600}
      .lbl{fill:#7f9d92;font-size:12px}
      .good{fill:#37d99a;font-size:12.5px;font-weight:600}
      .bad{fill:#e0664f;font-size:12.5px;font-weight:600}
      .axis{fill:#12201b}
      .tag{fill:#12201b;stroke:#26463a}
      .tagtxt{fill:#8fe9c4;font-size:11px;font-weight:600}
      .emptytag{fill:#1a1a1a;stroke:#3a3a3a}
    </style>
  </defs>
  <rect width="1120" height="640" fill="url(#bg)"/>
  <text x="40" y="46" class="h1">Drawing selection fix — before / after</text>
  <text x="40" y="70" class="lbl">Align the terminal's ChartDrawingOverlay with the proven-working Backtesting page (correct chartBounds + explicit z-layer).</text>

  <!-- ===================== BEFORE ===================== -->
  <text x="40" y="112" class="h2">BEFORE (now)</text>
  <g transform="translate(40,124)">
    <rect x="0" y="0" width="480" height="360" rx="10" fill="#0a1310" stroke="#1d3329"/>
    <!-- price axis (real, wider than assumed) -->
    <rect x="392" y="0" width="88" height="360" class="axis"/>
    <line x1="392" y1="0" x2="392" y2="360" stroke="#2a4a3c" stroke-dasharray="3 3"/>
    <text x="398" y="18" class="lbl">real axis</text>
    <!-- assumed 70 boundary -->
    <line x1="410" y1="0" x2="410" y2="360" stroke="#e0664f" stroke-dasharray="4 4"/>
    <text x="300" y="352" class="bad">assumes 70px axis ✗</text>
    <!-- candles -->
    <g fill="#1f7a5a">
      <rect x="30" y="150" width="8" height="70"/><rect x="55" y="130" width="8" height="90"/>
      <rect x="80" y="160" width="8" height="60"/><rect x="105" y="120" width="8" height="110"/>
      <rect x="130" y="140" width="8" height="95"/><rect x="155" y="170" width="8" height="70"/>
      <rect x="180" y="110" width="8" height="120"/><rect x="205" y="150" width="8" height="80"/>
    </g>
    <!-- horizontal line stops halfway -->
    <line x1="8" y1="200" x2="235" y2="200" stroke="#4fd6ff" stroke-width="2"/>
    <text x="120" y="192" class="bad">stops halfway ✗</text>
    <!-- empty price tag -->
    <rect x="392" y="192" width="70" height="18" rx="3" class="emptytag"/>
    <text x="398" y="205" class="lbl">(blank)</text>
    <!-- awkward + cursor offset -->
    <g stroke="#e0664f" stroke-width="2">
      <line x1="300" y1="270" x2="320" y2="270"/><line x1="310" y1="260" x2="310" y2="280"/>
    </g>
    <text x="326" y="274" class="bad">"+" offset ✗</text>
    <!-- click does nothing -->
    <circle cx="150" cy="200" r="9" fill="none" stroke="#e0664f" stroke-width="2"/>
    <text x="60" y="250" class="bad">click → nothing (can't select/delete) ✗</text>
  </g>

  <!-- ===================== AFTER ===================== -->
  <text x="600" y="112" class="h2">AFTER (fix)</text>
  <g transform="translate(600,124)">
    <rect x="0" y="0" width="480" height="360" rx="10" fill="#0a1310" stroke="#255a45"/>
    <rect x="392" y="0" width="88" height="360" class="axis"/>
    <line x1="392" y1="0" x2="392" y2="360" stroke="#37d99a"/>
    <text x="398" y="18" class="good">real axis ✓</text>
    <g fill="#1f7a5a">
      <rect x="30" y="150" width="8" height="70"/><rect x="55" y="130" width="8" height="90"/>
      <rect x="80" y="160" width="8" height="60"/><rect x="105" y="120" width="8" height="110"/>
      <rect x="130" y="140" width="8" height="95"/><rect x="155" y="170" width="8" height="70"/>
      <rect x="180" y="110" width="8" height="120"/><rect x="205" y="150" width="8" height="80"/>
      <rect x="230" y="135" width="8" height="95"/><rect x="255" y="165" width="8" height="70"/>
      <rect x="280" y="120" width="8" height="105"/><rect x="305" y="150" width="8" height="80"/>
      <rect x="330" y="140" width="8" height="90"/><rect x="360" y="160" width="8" height="65"/>
    </g>
    <!-- full-width line + selected (handles) -->
    <line x1="8" y1="200" x2="390" y2="200" stroke="#4fd6ff" stroke-width="2"/>
    <text x="150" y="192" class="good">spans full chart ✓</text>
    <circle cx="50" cy="200" r="6" fill="#4fd6ff" stroke="#fff" stroke-width="2"/>
    <circle cx="348" cy="200" r="6" fill="#4fd6ff" stroke="#fff" stroke-width="2"/>
    <!-- filled price tag -->
    <rect x="392" y="192" width="70" height="18" rx="3" class="tag"/>
    <text x="400" y="205" class="tagtxt">158.240</text>
    <!-- aligned + cursor -->
    <g stroke="#37d99a" stroke-width="2">
      <line x1="300" y1="270" x2="320" y2="270"/><line x1="310" y1="260" x2="310" y2="280"/>
    </g>
    <text x="326" y="274" class="good">"+" aligned ✓</text>
    <text x="60" y="250" class="good">click → selects → delete works ✓</text>
  </g>

  <!-- change list -->
  <g transform="translate(40,506)">
    <text x="0" y="0" class="h2">What changes (code)</text>
    <text x="0" y="26" class="lbl">1.  Pass real chartBounds to the overlay: priceAxisWidth from the live converter + correct timeAxisHeight (matches Backtesting).</text>
    <text x="0" y="48" class="lbl">2.  Give the overlay an explicit stacking layer so it always receives select clicks — while keeping OHLC toggle + wheel-zoom working.</text>
    <text x="0" y="70" class="lbl">3.  Build (tsc + vite), run in the live preview for you to test drawing/selecting, then push to your branch for Render.</text>
  </g>
</svg>
